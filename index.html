<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Companion Gym</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="Menu">☰</button>
    <h1 id="titre-vue">Aujourd'hui</h1>
    <button id="btn-timer-libre" class="icon-btn" aria-label="Minuteur">⏱</button>
    <button id="btn-export-rapide" class="icon-btn" aria-label="Exporter">⇩</button>
  </header>

  <nav id="menu" class="menu hidden">
    <button data-vue="aujourdhui">Aujourd'hui</button>
    <button data-vue="historique">Historique</button>
    <button data-vue="parametres">Paramètres</button>
  </nav>

  <main id="vue" class="vue">
    <p class="loading">Chargement…</p>
  </main>

  <div id="chrono" class="chrono hidden" role="timer">
    <div id="chrono-label" class="chrono-label"></div>
    <div class="chrono-ligne">
      <button class="chrono-btn" id="chrono-moins">−15s</button>
      <div class="chrono-temps" id="chrono-temps">00:00</div>
      <button class="chrono-btn" id="chrono-plus">+15s</button>
    </div>
    <div class="chrono-ligne">
      <button class="chrono-btn" id="chrono-skip">Suivant</button>
      <button class="chrono-btn" id="chrono-pause">⏸</button>
      <button class="chrono-btn chrono-stop" id="chrono-stop">Stop</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
